<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate pentru fiecare · Pregătire pentru examen</title>
<style>
:root{
  --bg:#f5f7fb;--bg2:#e9eef9;--surface:#ffffff;--ink:#0f1b33;--muted:#5b6780;--line:#dde4f0;
  --f1:#2f5bff;--f2:#12b5a6;--brand:#2f5bff;--brand2:#12b5a6;--accent:#ff8a3d;--ring:rgba(47,91,255,.28);
  --shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b1220;--bg2:#101a30;--surface:#131e36;--ink:#eef2fb;--muted:#9aa8c4;--line:#22304f;
  --brand:#7a96ff;--brand2:#3ad1c2;--f1:#4059d9;--f2:#12877f;--accent:#ffa566;--ring:rgba(122,150,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme=dark]{
  --bg:#0b1220;--bg2:#101a30;--surface:#131e36;--ink:#eef2fb;--muted:#9aa8c4;--line:#22304f;
  --brand:#7a96ff;--brand2:#3ad1c2;--f1:#4059d9;--f2:#12877f;--accent:#ffa566;--ring:rgba(122,150,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}.tbtn:hover{border-color:var(--brand);color:var(--brand)}.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.acct{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.acct a{flex:1;min-width:150px;text-align:center;padding:11px 14px;border-radius:12px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;text-decoration:none;background:var(--surface)}.acct a:hover{background:var(--f1);color:#fff}
.guide{margin:10px 0 0}.guide a{color:var(--brand);font-weight:700;text-decoration:none}.guide a:hover{text-decoration:underline}
.loginb{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:var(--f1);color:#fff;font-weight:700;font-size:.9rem;text-decoration:none;box-shadow:0 6px 16px var(--ring)}.loginb:hover{filter:brightness(1.08)}.navr{display:flex;align-items:center;gap:8px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 60%),
  radial-gradient(700px 420px at -5% 10%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 60%),var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;font-family:"Cambria","DejaVu Serif",Georgia,serif;color:var(--brand);opacity:.11;user-select:none;animation:drift linear infinite;will-change:transform}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}100%{transform:translate(0,0) rotate(0)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* bara de sus */
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
nav.stuck{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(15,27,51,.08)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--f1),var(--f2));color:#fff;display:grid;place-items:center;font:700 19px Georgia,serif;font-style:normal;box-shadow:0 6px 16px var(--ring)}
.logo span small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem inherit;font-family:inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.cta:focus-visible,.card:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"main msg" "cta msg";column-gap:36px;row-gap:6px;align-items:center;padding:30px 32px;margin-top:6px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-main{grid-area:main}.msg{grid-area:msg}.cta-wrap{grid-area:cta}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.eyebrow:before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}
h1{font-size:clamp(1.9rem,5.2vw,3.3rem);line-height:1.07;letter-spacing:-.03em;margin:12px 0 14px;font-weight:800;overflow-wrap:anywhere}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.author{margin:-6px 0 16px;font-size:.92rem;color:var(--muted)}.author b{color:var(--ink)}
.lead{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.6;color:var(--muted);margin:0 0 18px}

/* părerea ta contează */
#feedback{margin:40px 0 10px}#feedback h2{margin:0 0 6px}.fbintro{color:var(--muted);margin:0 0 16px;max-width:70ch}
.fbgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}@media(max-width:820px){.fbgrid{grid-template-columns:1fr}}
.fbcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.fbcard h3{margin:0 0 10px;font-size:1.05rem}
.fbtype{display:flex;gap:6px;margin-bottom:12px}.fbtype button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 10px;font:600 .86rem inherit;font-family:inherit;cursor:pointer}.fbtype button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.fbhint{font-size:.82rem;color:var(--muted);margin:-4px 0 10px}
.fbstars{display:flex;gap:4px;margin:4px 0 10px}.fbstars button{border:0;background:transparent;font-size:1.7rem;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}.fbstars button.on{color:#f59e0b}
.fbcard label{display:block;font-size:.84rem;font-weight:600;margin:10px 0 4px}
.fbcard input,.fbcard select,.fbcard textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:.95rem}
.fbcard textarea{min-height:110px;resize:vertical}.fbcard input:focus,.fbcard select:focus,.fbcard textarea:focus{outline:3px solid var(--ring);border-color:var(--brand)}
.fbrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.fbrow{grid-template-columns:1fr}}
.fbcnt{font-size:.78rem;color:var(--muted);text-align:right}
.fbsend{margin-top:12px;border:0;border-radius:999px;padding:11px 22px;background:linear-gradient(135deg,var(--f1),var(--f2));color:#fff;font:700 .95rem inherit;font-family:inherit;cursor:pointer}.fbsend:disabled{opacity:.6;cursor:default}
.fbmsg{margin-top:10px;font-size:.9rem;min-height:1.3em}.fbmsg.ok{color:#16a34a;font-weight:600}.fbmsg.err{color:#dc2626;font-weight:600}
.fbhp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
