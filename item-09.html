/* ---------- fracții ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };

/* ---------- parser de expresii ---------- */
function normExpr(s) {

    .replace(/[−–—‑]/g, '-').replace(/[·×⋅∙•]/g, '*').replace(/[÷:]/g, '/')

/* verificare câmp -> {ok, note} */
function checkField(f, raw) {

    const v = evalNum(raw);

/* alege o familie după nivel: lvl 1..3, 0 = oricare, 'exam' = familii marcate exam */
function makeProblem(item, r, lvl, usedSigs) {

  if (!pool.length) pool = item.families;
  for (let tries = 0; tries < 40; tries++) {
    const fam = r.pick(pool);
    const p = fam.gen(r);
    p.fam = fam.id; p.lvl = fam.lvl; p.item = item.n;
    if (!p.sig) p.sig = fam.id + '|' + JSON.stringify(p.fields.map(f => f.ans));
    if (!usedSigs || !usedSigs.has(p.sig)) { if (usedSigs) usedSigs.add(p.sig); return p; }
  }
  const fam = r.pick(pool); const p = fam.gen(r); p.fam = fam.id; p.lvl = fam.lvl; p.item = item.n; p.sig = p.sig || Math.random().toString(); return p;

/* set de n exerciții cu dificultate crescătoare (reproductibil după cod) */
function makeSet(item, code, tag, n, plan) {

const vmul = (a, k) => [a[0] * k, a[1] * k];
const vlen = a => Math.hypot(a[0], a[1]);
const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l]; };

  const u = vsub(a, v), w = vsub(b, v);

function orient(obj, r, wild) {

  const mirror = r.chance(.5);
  let deg = wild && r.chance(.6) ? r.range(0, 360) : r.range(-14, 14);
  const out = {};
  keys.forEach(k => { const p = obj[k]; out[k] = mirror ? [-p[0], p[1]] : p; });
  const c = [0, 0];
  keys.forEach(k => { out[k] = rotAll([out[k]], deg, c)[0]; });
  return out;
}

class Fig {
  constructor(W = 250, H = 180, pad = 26) { this.W = W; this.H = H; this.pad = pad; this.ops = []; this.pts = []; this.verts = []; }
  ext(P, r = 0) { this.pts.push([P[0] - r, P[1] - r], [P[0] + r, P[1] + r]); }
  seg(P, Q, o = {}) { this.ext(P); this.ext(Q); this.ops.push(T => { const a = T(P), b = T(Q); return `<line class="gl ${o.cls || ''}" ${o.dash ? 'stroke-dasharray="5 4"' : ''} x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`; }); return this; }
  poly(Ps, o = {}) { Ps.forEach((P, i) => this.seg(P, Ps[(i + 1) % Ps.length], o)); return this; }
  line(P, Q, o = {}) { // dreaptă infinită prin P,Q, extinsă cu margini
    const d = vnorm(vsub(Q, P)), ext = o.ext || 1.0; const a = vsub(P, vmul(d, ext)), b = vadd(Q, vmul(d, ext)); return this.seg(a, b, o); }
  circle(C, r, o = {}) { this.ext(C, r); this.ops.push((T, s) => { const c = T(C); return `<circle class="gl ${o.cls || ''}" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${(r * s).toFixed(1)}" fill="none"/>`; }); return this; }
  dot(P, o = {}) { this.ext(P); this.ops.push(T => { const c = T(P); return `<circle class="gd" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${o.r || 2.6}"/>`; }); return this; }
  /* etichetă de punct: se depărtează de centrul figurii (sau în direcția dir dată) */
  lab(P, txt, dir, dist = 12) { this.ext(P, 0); this.verts.push(P); this.ops.push((T, s, cen) => { const d = dir ? vnorm(dir) : vnorm(vsub(P, cen)); const c = T(P); const x = c[0] + d[0] * dist, y = c[1] - d[1] * dist; return `<text class="glab" x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle">${txt}</text>`; }); this.pts.push([P[0], P[1]]); return this; }
  text(P, txt, o = {}) { this.ops.push(T => { const c = T(P); return `<text class="gtxt ${o.cls || ''}" x="${(c[0] + (o.dx || 0)).toFixed(1)}" y="${(c[1] + (o.dy || 4)).toFixed(1)}" text-anchor="middle">${txt}</text>`; }); return this; }
  /* arc de unghi la V între semidreptele către P1 și P2, raza în px */
  arc(V, P1, P2, rpx, label, o = {}) {
    this.ops.push((T) => {
      const a1 = Math.atan2(P1[1] - V[1], P1[0] - V[0]), a2 = Math.atan2(P2[1] - V[1], P2[0] - V[0]);
      let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d <= -Math.PI) d += 2 * Math.PI;
      const c = T(V); const pt = a => [c[0] + rpx * Math.cos(a), c[1] - rpx * Math.sin(a)];
      const s = pt(a1), e = pt(a2); const sweep = d > 0 ? 0 : 1;
      let out = `<path class="ga ${o.cls || ''}" d="M${s[0].toFixed(1)} ${s[1].toFixed(1)} A${rpx} ${rpx} 0 0 ${sweep} ${e[0].toFixed(1)} ${e[1].toFixed(1)}"/>`;
      if (o.dbl) { const r2 = rpx + 3.5; const pt2 = a => [c[0] + r2 * Math.cos(a), c[1] - r2 * Math.sin(a)]; const s2 = pt2(a1), e2 = pt2(a2); out += `<path class="ga" d="M${s2[0].toFixed(1)} ${s2[1].toFixed(1)} A${r2} ${r2} 0 0 ${sweep} ${e2[0].toFixed(1)} ${e2[1].toFixed(1)}"/>`; }
      if (label) { const am = a1 + d / 2; const lr = rpx + (o.lr || 13); out += `<text class="gang" x="${(c[0] + lr * Math.cos(am)).toFixed(1)}" y="${(c[1] - lr * Math.sin(am) + 4).toFixed(1)}" text-anchor="middle">${label}</text>`; }
      return out;
    }); return this;
  }
  right(V, P1, P2, size = 9) {
    this.ops.push(T => { const c = T(V); const u = vnorm(vsub(P1, V)), w = vnorm(vsub(P2, V)); const a = [c[0] + u[0] * size, c[1] - u[1] * size], b = [c[0] + (u[0] + w[0]) * size, c[1] - (u[1] + w[1]) * size], e = [c[0] + w[0] * size, c[1] - w[1] * size];
      return `<path class="ga" d="M${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)} L${e[0].toFixed(1)} ${e[1].toFixed(1)}"/>`; }); return this;
  }
  tick(P, Q, n = 1) { // segmente congruente
    this.ops.push(T => { const a = T(P), b = T(Q); const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; const dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; const ux = dx / l, uy = dy / l, nx = -uy, ny = ux; let out = '';
      for (let i = 0; i < n; i++) { const off = (i - (n - 1) / 2) * 4; const cx = mx + ux * off, cy = my + uy * off; out += `<line class="ga" x1="${(cx + nx * 4).toFixed(1)}" y1="${(cy + ny * 4).toFixed(1)}" x2="${(cx - nx * 4).toFixed(1)}" y2="${(cy - ny * 4).toFixed(1)}"/>`; } return out; }); return this;
  }
  parMark(P, Q, n = 1) { // semn de paralelism (săgeți)
    this.ops.push(T => { const a = T(P), b = T(Q); const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; const dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; const ux = dx / l, uy = dy / l, nx = -uy, ny = ux; let out = '';
      for (let i = 0; i < n; i++) { const off = (i - (n - 1) / 2) * 6; const cx = mx + ux * off, cy = my + uy * off; out += `<path class="ga" d="M${(cx - ux * 4 + nx * 4).toFixed(1)} ${(cy - uy * 4 + ny * 4).toFixed(1)} L${(cx + ux * 2).toFixed(1)} ${(cy + uy * 2).toFixed(1)} L${(cx - ux * 4 - nx * 4).toFixed(1)} ${(cy - uy * 4 - ny * 4).toFixed(1)}"/>`; } return out; }); return this;
  }
  svg(extraPad = 0) {
    const P = this.pts; let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    P.forEach(p => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    const w = Math.max(maxx - minx, 1e-6), h = Math.max(maxy - miny, 1e-6);
    const pad = this.pad + extraPad;
    const s = Math.min((this.W - 2 * pad) / w, (this.H - 2 * pad) / h);
    const ox = (this.W - w * s) / 2, oy = (this.H - h * s) / 2;
    const T = p => [ox + (p[0] - minx) * s, oy + (maxy - p[1]) * s];
    const cen = this.verts.length ? [this.verts.reduce((a, p) => a + p[0], 0) / this.verts.length, this.verts.reduce((a, p) => a + p[1], 0) / this.verts.length] : [(minx + maxx) / 2, (miny + maxy) / 2];
    return `<svg class="fig" viewBox="0 0 ${this.W} ${this.H}" xmlns="http://www.w3.org/2000/svg" role="img">${this.ops.map(o => o(T, s, cen)).join('')}</svg>`;
  }
}

  const deg = co.length - 1; let out = '';

    if (overflowing(cols)) { cols.removeChild(el); if (cols.children.length === 0) { cols.appendChild(el); continue; } pg = newPage(); cols = $('.cols', pg); el = addEl(o.main[i].html); }
  }

    if (divEl && overflowing(cols)) { cols.removeChild(divEl); divEl = null; o.extra = null; }
    let guard = 0;

  C.adminHTML = function () {

  async function loadClassStudents(id) {

      w.style.display = 'none';
      b.style.display = 'flex';
    } else {
      // Încarcă iframe-ul abia la prima deschidere (evită fereastra goală)
      if (!f.src) { f.src = f.getAttribute('data-src'); }
      w.style.display = 'flex';
      b.style.display = 'none';
    }
  }
</script>

<style>@media print{#matetutor-launcher{display:none!important}}body:has(#pdfOverlay:not([hidden])) #matetutor-launcher{display:none!important}</style>
</body></html>
