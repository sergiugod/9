*{box-sizing:border-box}

.board{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.chip:focus-visible,.btn:focus-visible,.tab:focus-visible,.gcard:focus-visible,.opt:focus-visible,.lv:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.paper{--sq:color-mix(in srgb,var(--brand) 13%,transparent);position:relative;background-color:color-mix(in srgb,var(--surface) 38%,transparent);background-image:linear-gradient(var(--sq) 1px,transparent 1px),linear-gradient(90deg,var(--sq) 1px,transparent 1px);background-size:24px 24px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;box-shadow:none;padding:22px 24px 26px 56px;margin-top:16px;min-height:420px}

.sub{color:var(--muted);margin:0 0 14px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin:14px 0}

.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}

.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lv{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font:600 .82rem inherit;font-family:inherit;color:var(--muted)}

.stage{display:block}
@media(max-width:720px){.stage{grid-template-columns:1fr}.paper{padding:16px 14px 20px;border-radius:18px}}
.mascot{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:84px}
.mascot .owl{width:90px;height:100px}
.bubble{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:8px 10px;font-size:.82rem;text-align:center;position:relative;line-height:1.3;color:var(--ink)}

.owl.bounce{animation:bounce .6s}.owl.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.prob.okp{border-color:var(--ok)}.prob.badp{border-color:var(--bad)}

.pbody{flex:1;min-width:0}
.ptext{line-height:1.6;font-size:1.02rem}
.pfig{margin:8px 0;max-width:300px}
.pfig svg,svg.fig{width:100%;height:auto;display:block}
.pfields{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;align-items:center}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:1.02rem}
.fld .flab{white-space:nowrap}
input.ans{width:104px;border:1px solid var(--line);border-bottom:3px solid var(--brand);background:var(--bg);color:var(--ink);font:700 1.05rem inherit;font-family:inherit;padding:6px 8px;border-radius:8px;outline:0}
input.ans:focus{box-shadow:0 0 0 3px var(--ring)}
input.ans.ok{border-color:var(--ok);background:var(--okbg)}
input.ans.bad{border-color:var(--bad);background:var(--badbg)}
.mark{font-weight:800;font-size:1.2rem}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.opts{display:inline-flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;font:600 .9rem inherit;font-family:inherit}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--ink)}
.unit{color:var(--muted)}

.fr>i{font-style:normal;padding:0 .2em}.fr>i:first-child{border-bottom:1.5px solid currentColor}
.sq{white-space:nowrap}.sq .ov{border-top:1.5px solid currentColor;padding:0 1px}
sup{font-size:.7em;line-height:0}sub{font-size:.7em;line-height:0}
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;text-align:center;box-shadow:var(--shadow)}
.big{font:800 2.6rem inherit;font-family:inherit;letter-spacing:-.03em;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.badge{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:.88rem;font-weight:700}
.timer{position:sticky;top:64px;z-index:5;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand2) 88%,#000));color:#fff;border-radius:14px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;box-shadow:0 8px 20px var(--ring)}
.timer .t{font:700 1.3rem "DejaVu Sans Mono",monospace}.timer.low{background:#be123c}
.itemhead{display:flex;align-items:center;gap:12px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.itemhead:after{content:"";flex:1;height:1px;background:var(--line)}
table.rt{border-collapse:collapse;width:100%;background:var(--surface)}
table.rt td,table.rt th{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.rt th{background:var(--bg2)}
footer.lic{color:var(--muted);text-align:center;font-size:.8rem;padding:16px 6px 0}
footer.lic a{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal input[type=text],.modal input[type=password],.modal input[type=number],.modal select,.codein,#pdfCode,#pdfN,#codein{width:100%;padding:9px 11px;font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;margin:4px 0 10px;background:var(--bg);color:var(--ink)}
.codein,#codein{width:auto;margin:0}
.modal label{font-weight:700;font-size:.9rem}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:70;font-size:.9rem}
.teachbar{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:.9rem;font-weight:700}

.exsol{margin:0}.exrule{background:color-mix(in srgb,var(--brand2) 12%,transparent);border-left:4px solid var(--brand2);padding:10px 14px;border-radius:10px;line-height:1.55}
.codehelp{font-size:.85rem;margin:4px 0 0}
.tab{text-decoration:none;display:inline-block;font-size:.88rem;font-weight:600;font-family:inherit}

.theory table{border-collapse:collapse;margin:8px 0}.theory td,.theory th{border:1px solid var(--line);padding:5px 10px}
/* ---- desen geometric ---- */
svg.fig .gl{stroke:var(--fig);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

svg.fig .gd{fill:var(--fig)}
svg.fig .glab{font:italic 700 14px "Cambria","DejaVu Serif",serif;fill:var(--fig)}
svg.fig .gtxt{font:12px "DejaVu Sans",sans-serif;fill:var(--muted)}
svg.fig .ga{stroke:var(--figbad);stroke-width:1.5;fill:none}
svg.fig .gang{font:700 11px "DejaVu Sans",sans-serif;fill:var(--figbad)}
/* ---- fișa PDF ---- */
#pdfOverlay{position:fixed;inset:0;background:#6b7280;z-index:80;overflow:auto}

.pbar{position:sticky;top:0;z-index:2;background:#263238;color:#fff;display:flex;gap:8px;padding:8px 12px;align-items:center;flex-wrap:wrap}
.sheets{padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:14px}

.sheet .sfoot{border-top:.8px solid #555;margin-top:2mm;padding-top:1mm;font-size:8pt;color:#333;display:flex;justify-content:space-between}
.pex{break-inside:avoid;page-break-inside:avoid;display:flex;gap:2mm;margin:0 0 3.2mm;line-height:1.4}
.pex .pn{flex:0 0 6mm;font-weight:700}

@media print{
  @page{size:A4;margin:12mm}

}

  }
}

  function g11(r) {

        en: `a) Adjacent angles of a parallelogram are supplementary: ∠ADC = 180° ${MINUS} ${alpha}° = ${adc}°.<br>b) D${K} is a bisector: ∠${K}DC = ${adc}° : 2 = ${d}°. Since AB ∥ DC, alternate interior angles are equal: ∠A${K}D = ∠${K}DC = ${d}°.`

  registerItem({ n: 2, families: fam, theory: {"ro": "<h3>1. Unghiuri</h3><ul><li><b>Suplementare:</b> suma = 180°. <b>Complementare:</b> suma = 90°.</li><li><b>Opuse la vârf</b> sunt congruente.</li><li><b>Drepte paralele a ∥ b tăiate de o secantă:</b> unghiurile corespondente sunt egale; alterne interne egale; alterne externe egale; interne de aceeași parte au suma 180°.</li></ul>\n<h3>2. Triunghiul</h3><ul><li>Suma unghiurilor = 180°.</li><li><b>Unghi exterior</b> = suma celor două unghiuri interioare neadiacente lui.</li><li><b>Isoscel:</b> unghiurile de la bază sunt egale. <b>Echilateral:</b> toate unghiurile 60°, toate laturile egale; P = 3l.</li><li><b>Înălțimea</b> formează unghi de 90° cu latura; în triunghiul isoscel, înălțimea din vârf este și mediană și bisectoare.</li></ul>\n<h3>3. Paralelogramul</h3><div class=\"box\">Laturile opuse sunt paralele și egale; unghiurile opuse sunt egale; unghiurile alăturate au suma 180°.</div>\n<h3>4. Linia mijlocie</h3><ul><li><b>În triunghi</b> (unește mijloacele a două laturi): este paralelă cu a treia latură și are jumătate din lungimea ei: MN = BC : 2.</li><li><b>În trapez</b> (unește mijloacele laturilor neparalele): este paralelă cu bazele și MN = (B + b) : 2.</li></ul>\n<h3>5. Cercul</h3><ul><li><b>Unghi la centru</b> = măsura arcului cuprins. <b>Unghi înscris</b> = jumătate din arcul cuprins.</li><li>Un cerc împărțit în n arce congruente: fiecare arc are 360° : n.</li><li><b>Tangenta</b> este perpendiculară pe raza dusă în punctul de tangență (90°).</li><li><b>Lungimea cercului</b> L = 2πr; <b>aria discului</b> A = πr²; diametrul d = 2r.</li><li>Poziția unei drepte față de cerc: distanța d de la centru la dreaptă: d &lt; r secantă; d = r tangentă; d &gt; r exterioară.</li></ul>\n<h3>Cum răspunzi la itemul 2</h3><div class=\"ex\">Citește datele din desen, alege regula potrivită, calculează și scrie în casetă valoarea cerută (cm, grade sau expresie cu π).</div>", "ru": "<h3>1. Углы</h3><ul><li><b>Смежные:</b> сумма = 180°. <b>Дополнительные до 90°:</b> сумма = 90°.</li><li><b>Вертикальные</b> углы равны.</li><li><b>Параллельные a ∥ b и секущая:</b> соответственные углы равны; накрест лежащие равны; односторонние в сумме 180°.</li></ul>\n<h3>2. Треугольник</h3><ul><li>Сумма углов = 180°.</li><li><b>Внешний угол</b> = сумма двух внутренних, не смежных с ним.</li><li><b>Равнобедренный:</b> углы при основании равны. <b>Равносторонний:</b> все углы по 60°, стороны равны; P = 3a.</li><li><b>Высота</b> образует со стороной угол 90°; в равнобедренном треугольнике высота к основанию — также медиана и биссектриса.</li></ul>\n<h3>3. Параллелограмм</h3><div class=\"box\">Противоположные стороны параллельны и равны; противоположные углы равны; соседние углы в сумме 180°.</div>\n<h3>4. Средняя линия</h3><ul><li><b>В треугольнике</b> (соединяет середины двух сторон): параллельна третьей стороне и равна её половине: MN = BC : 2.</li><li><b>В трапеции</b> (соединяет середины боковых сторон): параллельна основаниям, MN = (B + b) : 2.</li></ul>\n<h3>5. Окружность</h3><ul><li><b>Центральный угол</b> = дуге, на которую опирается. <b>Вписанный угол</b> = половине дуги.</li><li>Окружность, разделённая на n равных дуг: каждая дуга 360° : n.</li><li><b>Касательная</b> перпендикулярна радиусу в точке касания (90°).</li><li><b>Длина окружности</b> L = 2πr; <b>площадь круга</b> A = πr²; диаметр d = 2r.</li><li>Прямая и окружность: расстояние d от центра до прямой: d &lt; r — секущая; d = r — касательная; d &gt; r — не пересекает.</li></ul>\n<h3>Как отвечать в задании 2</h3><div class=\"ex\">Считай данные с чертежа, выбери нужное правило, вычисли и впиши в поле значение (см, градусы или выражение с π).</div>", "en": "<h3>1. Angles</h3><ul><li><b>Supplementary:</b> sum = 180°. <b>Complementary:</b> sum = 90°.</li><li><b>Vertical angles</b> are equal.</li><li><b>Parallel lines a ∥ b cut by a transversal:</b> corresponding angles are equal; alternate interior angles are equal; co-interior angles add up to 180°.</li></ul>\n<h3>2. Triangle</h3><ul><li>Angle sum = 180°.</li><li><b>Exterior angle</b> = sum of the two non-adjacent interior angles.</li><li><b>Isosceles:</b> base angles are equal. <b>Equilateral:</b> all angles 60°, all sides equal; P = 3a.</li><li>An <b>altitude</b> makes a 90° angle with the side; in an isosceles triangle the altitude to the base is also a median and angle bisector.</li></ul>\n<h3>3. Parallelogram</h3><div class=\"box\">Opposite sides are parallel and equal; opposite angles are equal; adjacent angles add up to 180°.</div>\n<h3>4. Midline</h3><ul><li><b>In a triangle</b> (joins midpoints of two sides): parallel to the third side and half as long: MN = BC : 2.</li><li><b>In a trapezoid</b> (joins midpoints of the legs): parallel to the bases, MN = (B + b) : 2.</li></ul>\n<h3>5. Circle</h3><ul><li><b>Central angle</b> = its arc. <b>Inscribed angle</b> = half its arc.</li><li>A circle split into n equal arcs: each arc is 360° : n.</li><li>A <b>tangent</b> is perpendicular to the radius at the point of tangency (90°).</li><li><b>Circumference</b> L = 2πr; <b>area</b> A = πr²; diameter d = 2r.</li><li>Line vs circle: distance d from the centre to the line: d &lt; r secant; d = r tangent; d &gt; r no intersection.</li></ul>\n<h3>How to answer item 2</h3><div class=\"ex\">Read the data from the figure, pick the right rule, calculate and write the requested value (cm, degrees or an expression with π) in the box.</div>"}, example: {

function fieldHTML(p, i, j, o) {

function probHTML(p, i, o) {
  const res = o.res && o.res[i];
  const cls = res && o.locked ? (res.all ? 'okp' : 'badp') : '';
  let extra = '';
  if (o.reveal) extra += `<div class="fb ${res && res.all ? 'good' : ''}">${res && res.all ? '' : `${tx('correctAns')}: `}${res && res.all ? '' : ansHTML(p)}</div>`;

  if (o.hint) extra += `<div class="hintbox">💡 ${p.hint ? p.hint(S.lang) : ''}</div>`;
  if (S.teacher && !o.reveal) extra += `<div class="key"><b>${tx('tAnswer')}:</b> ${ansHTML(p)}</div>`;
  return `<div class="prob ${cls}"><div class="pnum">${o.num != null ? o.num : i + 1}</div><div class="pbody"><div class="ptext">${p.text(S.lang)}</div>${p.fig ? `<div class="pfig">${p.fig}</div>` : ''}<div class="pfields">${p.fields.map((f, j) => fieldHTML(p, i, j, o)).join('')}</div>${o.note || ''}${extra}</div></div>`;

  C.teacherHTML = function () {
    if (!C.enabled) return '<p class="sub">Conturile nu sunt configurate pe acest site.</p>';
    if (C.error) return '<p class="sub">Nu s-a putut încărca serviciul de conturi. Verifică conexiunea la internet.</p>';
    if (!C.ready) return '<p class="sub">Se încarcă…</p>';
    if (!C.user) return authForm();
    if (C.role === 'student') return '<p class="sub">Ești conectat ca elev. Ieși din cont ca să intri ca profesor.</p><button class="btn alt" data-cl="logout">Ieși</button>';
    if (!C.tdoc) return profileForm();
    if (C.tdoc.status === 'pending') return `<div class="pan2"><h3>Cont în așteptare</h3><p class="sub">Contul ${esc(C.user.email)} așteaptă aprobarea administratorului. Revino după ce ești anunțat.</p><button class="btn alt" data-cl="reloadauth">Verifică din nou</button> <button class="btn alt" data-cl="logout">Ieși</button></div>`;
    if (C.tdoc.status === 'rejected') return `<div class="pan2"><h3>Cont respins</h3><p class="sub">Contul nu a fost aprobat.</p><button class="btn alt" data-cl="logout">Ieși</button></div>`;
    if (C.classes === null && !C.busy) setTimeout(loadClasses, 0);
    return `<div class="row"><b>${esc(C.tdoc.name)}</b> · ${esc(C.tdoc.school || '')} <button class="btn alt" data-cl="logout">Ieși</button></div>` + dashboard();
  };
  C.adminHTML = function () {
    if (!C.enabled) return '<p class="sub">Conturile nu sunt configurate pe acest site.</p>';
    if (!C.ready) return '<p class="sub">Se încarcă…</p>';
    if (!C.user) return authForm();
    if (C.role !== 'admin') return '<p class="sub">Acest cont nu are drept de administrator.</p><button class="btn alt" data-cl="logout">Ieși</button>';
    if (C.teachers === null && !C.busy) setTimeout(loadTeachers, 0);
    const ts = C.teachers || [];
    const ok = ts.filter(x => x.status === 'approved').length;
    const row = x => `<tr><td>${esc(x.name)}<br><small>${esc(x.email)}</small></td><td>${esc(x.school || '')}</td><td class="st ${x.status}">${{ pending: 'în așteptare', approved: 'aprobat', rejected: 'respins' }[x.status]}</td><td>${x.status !== 'approved' ? `<button class="btn" data-cl="approve" data-id="${x.id}">Aprobă</button>` : ''} ${x.status !== 'rejected' ? `<button class="btn alt" data-cl="reject" data-id="${x.id}">Respinge</button>` : ''} <button class="lk" data-cl="delteacher" data-id="${x.id}">Elimină</button></td></tr>`;
    return `<div class="pan2"><h3>Profesori: ${ok} / ${MAXT} aprobați</h3><div class="row"><button class="btn alt" data-cl="reloadt">Reîncarcă</button><button class="btn alt" data-cl="logout">Ieși</button></div>
      ${ts.length ? `<div style="overflow:auto"><table class="restab"><thead><tr><th>Profesor</th><th>Școala</th><th>Stare</th><th></th></tr></thead><tbody>${ts.slice().sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1)).map(row).join('')}</tbody></table></div>` : '<p class="sub">Niciun profesor înregistrat încă.</p>'}</div>`;
  };
  async function loadClasses() {
    if (!fb || !C.user || C.busy) return; C.busy = true;
    try { const q = await fb.db.collection('classes').where('teacherUid', '==', C.user.uid).get(); C.classes = q.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { C.classes = []; }
    C.busy = false; rerender();
  }
  async function loadStudents() {
    if (!C.sel) return; C.students = null; rerender();
    try { const q = await fb.db.collection(`classes/${C.sel}/students`).get(); C.students = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ro')); } catch (e) { C.students = []; }
    rerender();
  }
  async function loadTeachers() {
    if (!fb || C.busy) return; C.busy = true;
    try { const q = await fb.db.collection('teachers').get(); C.teachers = q.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { C.teachers = []; }
    C.busy = false; rerender();
  }
  const tErr = m => { const x = $('#tErr'); if (x) x.textContent = m; };
  const eMsg = e => { const c = (e && e.code) || ''; if (/wrong-password|invalid-credential|user-not-found|invalid-email/.test(c)) return 'E-mail sau parolă greșită.'; if (/email-already/.test(c)) return 'Există deja un cont cu acest e-mail.'; if (/weak/.test(c)) return 'Parola este prea scurtă (minim 6 caractere).'; if (/popup/.test(c)) return 'Fereastra Google a fost închisă sau blocată.'; return 'Eroare: ' + (c || (e && e.message)); };
  /* ---------- evenimente ---------- */
  document.addEventListener('click', async e => {
    const b = e.target.closest && e.target.closest('[data-cl]'); if (!b || !fb && !['open', 'close', 'tmopen'].includes(b.dataset.cl)) return;
    const a = b.dataset.cl, id = b.dataset.id;
    try {
      if (a === 'open') openJoin();
      else if (a === 'close') { const m = $('#modal'); if (m) m.innerHTML = ''; }
      else if (a === 'join') await joinClass();
      else if (a === 'save') await C.save();
      else if (a === 'logout') { try { sessionStorage.removeItem('mpf-teacher'); window.__setTeacher && window.__setTeacher(false); } catch (x) {} await fb.auth.signOut(); }
      else if (a === 'tmin' || a === 'tmgoogle') {
        C.wantTeacher = true;
        try { if (a === 'tmin') await fb.auth.signInWithEmailAndPassword(val('tEmail'), val('tPass')); else await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        catch (x) { const e2 = $('#tmErr'); if (e2) e2.textContent = eMsg(x); return; }
        await new Promise(r => setTimeout(r, 600));
        if (C.isTeacher()) { const m = $('#modal'); if (m) m.innerHTML = ''; } else if (C.role === 'student') { const e2 = $('#tmErr'); if (e2) e2.textContent = 'Acesta este un cont de elev.'; }
        else { const e2 = $('#tmErr'); if (e2) e2.textContent = 'Contul nu este (încă) aprobat de administrator.'; }
      }
      else if (a === 'tin') await fb.auth.signInWithEmailAndPassword(val('tEmail'), val('tPass'));
      else if (a === 'tgoogle') await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      else if (a === 'treg') {
        const name = val('tName'), school = val('tSchool'); if (!name) { tErr('Completează numele (în „Cont nou”).'); return; }
        const cr = await fb.auth.createUserWithEmailAndPassword(val('tEmail'), val('tPass'));
        await fb.db.doc('teachers/' + cr.user.uid).set({ email: cr.user.email, name, school, status: 'pending', created: firebase.firestore.FieldValue.serverTimestamp() });
        C.tdoc = { email: cr.user.email, name, school, status: 'pending' }; rerender();
      }
      else if (a === 'tprofile') {
        const name = val('tName'), school = val('tSchool'); if (!name) { tErr('Completează numele.'); return; }
        await fb.db.doc('teachers/' + C.user.uid).set({ email: C.user.email, name, school, status: 'pending', created: firebase.firestore.FieldValue.serverTimestamp() });
        C.tdoc = { email: C.user.email, name, school, status: 'pending' }; rerender();
      }
      else if (a === 'reloadauth') { const d = await fb.db.doc('teachers/' + C.user.uid).get(); C.tdoc = d.exists ? d.data() : null; rerender(); }
      else if (a === 'newclass') {
        const name = val('newCls'); if (!name) return;
        let code = ''; for (let i = 0; i < 8; i++) { const c = genCode(); const d = await fb.db.doc('classes/' + c).get(); if (!d.exists) { code = c; break; } }
        if (!code) return;
        await fb.db.doc('classes/' + code).set({ teacherUid: C.user.uid, name, created: firebase.firestore.FieldValue.serverTimestamp() });
        C.classes = null; C.sel = code; C.students = []; rerender();
      }
      else if (a === 'selclass') { C.sel = id; C.open = null; await loadStudents(); }
      else if (a === 'reload') await loadStudents();
      else if (a === 'copycode') { try { await navigator.clipboard.writeText(C.sel); toast('Cod copiat'); } catch (x) { toast(C.sel); } }
      else if (a === 'openstu') { C.open = C.open === id ? null : id; rerender(); }
      else if (a === 'delstu') { if (confirm('Elimini elevul din clasă? Progresul lui salvat se șterge.')) { await fb.db.doc(`classes/${C.sel}/students/${id}`).delete(); C.open = null; await loadStudents(); } }
      else if (a === 'delclass') { if (confirm('Ștergi clasa? Elevii nu vor mai putea salva progresul în ea.')) { for (const s of (C.students || [])) await fb.db.doc(`classes/${C.sel}/students/${s.id}`).delete(); await fb.db.doc('classes/' + C.sel).delete(); C.classes = null; C.sel = null; C.students = null; rerender(); } }
      else if (a === 'csv') {
        const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
        const hd = ['Elev'].concat(Array.from({ length: 12 }, (_, i) => 'Item ' + (i + 1) + ' rezolvate'), Array.from({ length: 12 }, (_, i) => 'Item ' + (i + 1) + ' test %'), ['Examen %', 'Salvat']);
        const rows = (C.students || []).map(s => { const p = s.progress || {}; const n = i => p[i] || {}; return [s.name].concat(Array.from({ length: 12 }, (_, i) => n(i + 1).solved || 0), Array.from({ length: 12 }, (_, i) => n(i + 1).best ? Math.round(n(i + 1).best * 100) : ''), [p.exam ? Math.round(p.exam * 100) : '', fdate(s.saved)]); });
        const csv = '﻿' + [hd].concat(rows).map(r => r.map(q).join(',')).join('\n');
        const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); l.download = 'clasa-' + C.sel + '.csv'; l.click();
      }
      else if (a === 'reloadt') { C.teachers = null; await loadTeachers(); }
      else if (a === 'approve') {
        const ok = (C.teachers || []).filter(x => x.status === 'approved').length;
        if (ok >= MAXT && !confirm(`Ai deja ${ok} profesori aprobați (limita pilotului: ${MAXT}). Aprobi totuși?`)) return;
        await fb.db.doc('teachers/' + id).update({ status: 'approved' }); C.teachers = null; await loadTeachers();
      }
      else if (a === 'reject') { await fb.db.doc('teachers/' + id).update({ status: 'rejected' }); C.teachers = null; await loadTeachers(); }
      else if (a === 'delteacher') { if (confirm('Elimini contul de profesor din listă?')) { await fb.db.doc('teachers/' + id).delete(); C.teachers = null; await loadTeachers(); } }
    } catch (x) { if (['tin', 'tgoogle', 'treg', 'tprofile'].includes(a)) tErr(eMsg(x)); else toast(eMsg(x)); }
  });
  window.CLD = C; init();
})();

      <circle cx="24" cy="24" r="22" fill="white" fill-opacity="0.15"/>
      <path d="M24 8L6 18l18 10 18-10L24 8z" fill="white"/>
      <path d="M12 22v10c0 2 5.4 6 12 6s12-4 12-6V22" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M42 18v12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="42" cy="31" r="1.5" fill="white"/>
      <text x="24" y="29" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB" font-family="Inter, system-ui, sans-serif">π</text>

  <div id="matetutor-window" style="display:none;">

    </div>
    <div id="matetutor-frame-wrap">
      <div id="matetutor-loading">Se încarcă MateTutor…</div>
      <iframe
        id="matetutor-iframe"
        data-src="https://matemate-tutor-bubdib.abacusai.app"
        title="MateTutor – Tutore AI de Matematică"
        allow="clipboard-write"

  </div>
</div>

    transform: scale(1.08);
    box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5);
  }

    position: fixed;
    bottom: 96px;

</style>

<script>
  function toggleMateTutor() {
    var w = document.getElementById('matetutor-window');
    var b = document.getElementById('matetutor-btn');
    var f = document.getElementById('matetutor-iframe');
    var isOpen = (w.style.display !== 'none' && w.style.display !== '');
    if (isOpen) {
      w.style.display = 'none';
      b.style.display = 'flex';
    } else {
      // Încarcă iframe-ul abia la prima deschidere (evită fereastra goală)
      if (!f.src) { f.src = f.getAttribute('data-src'); }
      w.style.display = 'flex';
      b.style.display = 'none';
    }
  }
</script>
